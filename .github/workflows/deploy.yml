name: Crawl Opportunities & Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  schedule:
    # 매일 한국 시간(KST) 오전 9시(UTC 00:00), 오후 2시(UTC 05:00), 저녁 8시(UTC 11:00) 하루 3번 자동 수집 및 배포
    - cron: "0 0,5,11 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Opportunity Crawler
        env:
          # 사람인 Open API 키 (없으면 사람인 수집만 건너뜀)
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
        run: python3 scripts/crawler.py

      - name: Commit updated opportunities.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/opportunities.json
          git diff --staged --quiet || git commit -m "chore(data): update crawled opportunities [skip ci]"
          git push || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: "./dist"

      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if count=$(gh api \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts | map(select(.expired == false)) | length') && [ "$count" = 1 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT_NAME was not visible before deployment"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

